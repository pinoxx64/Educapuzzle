<p-dialog header="Objetos de la categoría" [(visible)]="visible" (onHide)="handleHide()" [modal]="true" [style]="{width: '800px'}">
  <div class="p-d-flex p-jc-between p-ai-center" style="margin-bottom: 1rem;">
    <h3 style="margin:0;">Objetos ({{ categoria?.nombre || 'Sin categoría' }})</h3>
    <button pButton type="button" label="Crear" icon="pi pi-plus" (click)="abrirCrearObj()"></button>
  </div>
  <p-confirmpopup></p-confirmpopup>

  <p-table [value]="objetos" [paginator]="true" [rows]="10" [responsiveLayout]="'scroll'">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-objeto>
      <tr>
        <td>{{ objeto.nombre }}</td>
        <td>
          <button pButton type="button" label="Editar" icon="pi pi-pencil" (click)="abrirEditarObj(objeto)"></button>
          <button pButton type="button" label="Eliminar" severity="danger" icon="pi pi-trash" class="p-button-text"
            (click)="deleteObj($event, objeto.id)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <app-crear-objeto
    [visible]="dialogCrearVisible"
    [idCategoria]="categoria?.id"
    (onClose)="cerrarCrearObj()"
    (onSave)="guardarNuevaObjeto($event)">
  </app-crear-objeto>

  <app-editar-objeto
    [visible]="dialogEditarVisible"
    [objeto]="objetoAEditar"
    (onClose)="cerrarEditarObj()"
    (onSave)="guardarEdicionObjeto($event)">
  </app-editar-objeto>
</p-dialog>
