<p-table [value]="categorias" [paginator]="true" [rows]="10" [responsiveLayout]="'scroll'">
  <ng-template pTemplate="header">
    <tr>
      <th>Nombre</th>
      <th>Acciones</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-categorias>
    <tr>
      <td>{{ categorias.nombre }}</td>
      <td>
        <button pButton type="button" label="Editar" severity="info" icon="pi pi-pencil" class="p-button-text"
          (click)="abrirEditarCategoria(categorias)"></button>
        <button pButton type="button" label="Eliminar" severity="danger"
          icon="pi pi-trash" class="p-button-text" (click)="deleteCategorias($event, categorias.id)"></button>
      </td>
    </tr>
  </ng-template>
</p-table>
