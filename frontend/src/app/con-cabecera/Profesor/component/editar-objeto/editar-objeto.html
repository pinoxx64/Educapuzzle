<p-dialog header="Editar objeto" [(visible)]="visible" (onHide)="cerrar()" [modal]="true" [style]="{width: '600px'}">
  
  <div *ngIf="erMensaje" style="color: red; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid red; border-radius: 4px;">
    {{ erMensaje }}
  </div>

  <div style="margin-bottom: 1rem;">
    <label for="nombre"><strong>Nombre del objeto</strong></label>
    <input id="nombre" [(ngModel)]="nombre" type="text" pInputText style="width: 100%; padding: 0.5rem;">
  </div>

  <div style="margin-bottom: 1rem;">
    <label><strong>Características</strong></label>
    <div *ngFor="let carac of caracteristicasSeleccionadas; let i = index; trackBy: trackByUid" style="margin-bottom: 0.75rem; display: flex; gap: 0.5rem; align-items: center; width: 100%;">
      
      <p-select 
        [(ngModel)]="carac.idCaracteristica" 
        [options]="allCaracteristicas" 
        optionLabel="nombre" 
        optionValue="id"
        placeholder="Selecciona característica"
        appendTo="body"
        [showClear]="true"
        styleClass="w-full"
        [style]="{'width': '100%'}">
      </p-select>

      <button 
        *ngIf="puedeBorrar(i)" 
        pButton 
        type="button" 
        icon="pi pi-trash" 
        severity="danger" 
        [text]="true"
        (click)="borrarCaracteristica(i)"
        style="flex-shrink: 0;">
      </button>
    </div>

    <button pButton type="button" label="Agregar característica" icon="pi pi-plus" (click)="agregarCaracteristica()" style="margin-top: 0.5rem; width: 100%;"></button>
  </div>

  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancelar" (click)="cerrar()"></button>
    <button pButton type="button" label="Guardar" severity="success" (click)="save()"></button>
  </ng-template>

</p-dialog>
