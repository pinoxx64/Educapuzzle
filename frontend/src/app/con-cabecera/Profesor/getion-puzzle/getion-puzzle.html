<p-table [value]="categorias" [paginator]="true" [rows]="10" [responsiveLayout]="'scroll'">
  <ng-template pTemplate="header">
    <tr>
      <th>Nombre</th>
      <th>Acciones</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-categorias>
    <tr>
      <td>{{ categorias.nombre }}</td>
      <td>
        <button pButton type="button" label="Editar" severity="info" icon="pi pi-pencil" class="p-button-text"
          (click)="abrirEditarCategoria(categorias)"></button>
        <button pButton type="button" label="Eliminar" severity="danger"
          icon="pi pi-trash" class="p-button-text" (click)="deleteCategorias($event, categorias.id)"></button>
        <button pButton type="button" label="Objetos" severity="info"
          icon="pi pi-clipboard" class="p-button-text" (click)="abrirVerObj()"></button>
        <button pButton type="button" label="Caracteristicas" severity="help"
          icon="pi pi-palette" class="p-button-text" (click)="abrirVerCarac()"></button>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-editar-categoria
  [visible]="dialogEditarVisible"
  [categoria]="categoriaAEditar"
  (onClose)="cerrarEditarCategoria()"
  (onSave)="guardarEdicionCategoria()"
></app-editar-categoria>

<app-crear-categoria
  [visible]="dialogCrearVisible"
  (onClose)="cerrarCrearCategoria()"
  (onSave)="guardarNuevaCategoria($any($event))"
></app-crear-categoria>
