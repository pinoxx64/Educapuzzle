<div class="login-container">
    <h3>Inicia Sesión</h3>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <label for="name">Nombre</label>
        <input
            type="name"
            id="name"
            name="name"
            [(ngModel)]="name"
            required
        /> 
        <label for="correo">Correo electronico</label>
        <input
            type="correo"
            id="correo"
            name="correo"
            [(ngModel)]="correo"
            required
        /> 
        <label for="contrasena">Contraseña</label>
        <input
            type="contrasena"
            id="contrasena"
            name="contrasena"
            [(ngModel)]="contrasena"
            required
        />
        <button type="submit" style="color: black;" [disabled]="!loginForm.valid">Iniciar Sesión</button>
    </form> 
    <div class="text-center">
        <p style="color: #59238F;">Inicia sesion</p>
    </div>
</div>
